name: Sync from expatliving.it

# Refreshes the mirror from the live site. No secrets: it reads only the public
# site and commits with the built-in GITHUB_TOKEN.
#
# Runs by hand from the Actions tab and every Monday. Once the repository is
# public its Actions minutes are free; while it is private they come out of the
# same account quota as the site repo.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Fetch the files listed in manifest.json
        id: sync
        run: node scripts/sync.mjs

      - name: Commit the snapshot
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Snapshot from expatliving.it ($(date -u +%F))"
          git push
